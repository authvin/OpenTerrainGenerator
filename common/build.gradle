architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("otg.accesswidener")
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    implementation project(':common:common-util')
    implementation project(':common:common-customobject')
    implementation project(':common:common-generator')
    implementation project(':common:common-core')
}

allprojects {
    dependencies {
        // Shaded dependencies
        api("com.fasterxml.jackson.core:jackson-annotations:2.17.1")
        api("com.fasterxml.jackson.core:jackson-core:2.17.1")
        api("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.1")
        api('com.fasterxml.jackson.core:jackson-databind:2.17.1')
        api('com.fasterxml.jackson.module:jackson-module-jsonSchema:2.17.1')
        api('org.yaml:snakeyaml:2.2')
        compileOnly 'org.projectlombok:lombok:1.18.32'
        annotationProcessor 'org.projectlombok:lombok:1.18.32'
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}