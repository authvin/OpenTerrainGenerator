buildscript {
    repositories {
        jcenter()
        maven { url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath group: "net.minecraftforge.gradle", name: "ForgeGradle", version: "6.0.+"
    }
}
apply plugin: "net.minecraftforge.gradle"
apply plugin: 'signing'

// Project properties
archivesBaseName = "openterraingenerator-forge"
description = "OpenTerrainGenerator for Minecraft Forge"
ext.worldeditVersion = "6.1"
ext.minecraftVersion = "1.12.2"

dependencies {
    minecraft "net.minecraftforge:forge:1.12.2-14.23.5.2860"
    implementation project(':common')
    compileOnly  ('com.sk89q.worldedit:worldedit-forge-mc1.11:6.1.6') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.gson'
    }
    compileOnly  ('com.sk89q.worldedit:worldedit-core:6.0.1') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.gson'
    }
    implementation 'com.google.guava:guava:23.0'
    implementation 'com.google.code.gson:gson:2.6.2'
}

minecraft {
    mappings channel: "stable", version: "39-1.12"
    // version = "1.12.2-14.23.5.2860"
    // runDir = "run"
    runs {
        "client" {
            workingDirectory file("./run")
            mods { "${project.name}" { source sourceSets.main } }
        }

        "server" {
            workingDirectory file("./run/server")
            mods { "${project.name}" { source sourceSets.main } }
        }
    }

    accessTransformer = project.file('src/main/resources/accesstransformer.cfg')
    
    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // simply re-run your setup task after changing the mappings to update your workspace.

    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
}

repositories
{
    maven {
        url = "https://maven.minecraftforge.net/"
    }
    maven 
    {   // Worldedit API
   		url "https://maven.enginehub.org/artifactory/repo/" 
   	}
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", minecraftVersion

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':minecraftVersion
    }
        
    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Include all OpenTerrainGenerator files in the jar
jar
{
    destinationDirectory = new File(project.buildDir, "distributions")
    archiveClassifier.set("")
    from
    {
        project(":common").sourceSets.main.output.files
    }
}

// Package OTG-Core jar inside the OTG-Forge jar.

// Define the asmJar task
task asmJar(type: Jar, dependsOn: 'compileJava') {
    from(sourceSets.main.output) {
        include "com/pg85/otg/forge/asm/**"
    }
    archiveFileName.set("OTG-Core.jar")
    manifest {
        attributes(
                'FMLCorePlugin': 'com.pg85.otg.forge.asm.excluded.launch.OTGCorePlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}

// Define the rootJar task
task rootJar(type: Jar, dependsOn: ['compileJava', asmJar]) {
    manifest {
        attributes(
                'ContainedDeps': 'OTG-Core.jar',
                'FMLAT': 'accesstransformer.cfg'
        )
    }

    from(sourceSets.main.output) {
        exclude "com/pg85/otg/forge/asm/OTGClassTransformer.class"
        exclude "com/pg85/otg/forge/asm/OTGHooks.class"
        exclude "com/pg85/otg/forge/asm/launch/**"
    }
    from("build/libs") {
        include "OTG-Core.jar"
    }

    destinationDirectory.set(file("${project.getLayout().getBuildDirectory()}/distributions"))
}

// Hook rootJar into the reobf task to ensure it is re-obfuscated
reobf {
    register('rootJar')

}

// Ensure that rootJar runs as part of the build process
build.dependsOn rootJar